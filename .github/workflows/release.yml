name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci-gate:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build DMG & GitHub Release
    needs: ci-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install dmgbuild
        run: pip install -r requirements-dev.txt

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (no DMG)
        run: npx tauri build --bundles app

      - name: Build DMG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p src-tauri/target/release/bundle/dmg
          dmgbuild -s scripts/dmg-settings.py "macweep" \
            "src-tauri/target/release/bundle/dmg/macweep_${TAG_NAME}_aarch64.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/dmg/*.dmg
