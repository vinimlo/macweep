<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800">
  <defs>
    <!-- Base dark gradient matching icon background -->
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="70%" fx="45%" fy="50%">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="50%" stop-color="#0b1219"/>
      <stop offset="100%" stop-color="#060a0f"/>
    </radialGradient>

    <!-- Cyan ambient light from the sweep motif -->
    <radialGradient id="cyanAmbient" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#00a5cc" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Top-left subtle light -->
    <radialGradient id="topLight" cx="20%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#1a2a3a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Dotted line gradient -->
    <linearGradient id="dotsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.0"/>
      <stop offset="15%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Noise filter for texture -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="faintNoise">
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faintNoise" mode="screen"/>
    </filter>

    <!-- Glow filter for the sweep lines -->
    <filter id="sweepGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle text glow -->
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1320" height="800" fill="url(#bgGlow)"/>
  <rect width="1320" height="800" fill="url(#topLight)"/>
  <rect width="1320" height="800" fill="url(#cyanAmbient)"/>

  <!-- Noise texture overlay -->
  <rect width="1320" height="800" fill="transparent" filter="url(#noise)"/>

  <!-- Atmospheric sweep lines (echoing the icon's blade motif) -->
  <g filter="url(#sweepGlow)" opacity="0.12">
    <!-- Main sweep -->
    <path d="M 100 520 Q 400 440, 660 400 Q 920 360, 1220 320"
          fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Secondary sweep -->
    <path d="M 150 540 Q 450 470, 700 440 Q 950 410, 1250 390"
          fill="none" stroke="#00b8e0" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Tertiary sweep -->
    <path d="M 50 510 Q 350 420, 620 370 Q 890 320, 1180 280"
          fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-linecap="round"/>
  </g>

  <!-- Subtle horizon line -->
  <line x1="0" y1="530" x2="1320" y2="530" stroke="#00d4ff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Drop zone labels area -->
  <!-- Left: App icon zone (centered at x=370, y=380) -->
  <!-- Right: Applications folder zone (centered at x=950, y=380) -->

  <!-- Directional guide: dotted arc between icon positions -->
  <path d="M 480 380 Q 660 340, 840 380"
        fill="none"
        stroke="url(#dotsGrad)"
        stroke-width="1.5"
        stroke-dasharray="6 8"
        stroke-linecap="round"
        opacity="0.6"/>

  <!-- Small chevron arrow at end of arc -->
  <g transform="translate(838, 377)" opacity="0.5">
    <polyline points="-8,-6 0,0 -8,6" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- "macweep" wordmark -->
  <text x="660" y="620"
        font-family="SF Pro Display, -apple-system, Helvetica Neue, sans-serif"
        font-size="26"
        font-weight="300"
        letter-spacing="8"
        text-anchor="middle"
        fill="#00d4ff"
        fill-opacity="0.35"
        filter="url(#textGlow)">MACWEEP</text>

  <!-- Version tag -->
  <text x="660" y="652"
        font-family="SF Pro Text, SF Pro Display, -apple-system, Helvetica Neue, sans-serif"
        font-size="13"
        font-weight="300"
        letter-spacing="3"
        text-anchor="middle"
        fill="#4a6a7a"
        fill-opacity="0.5">v0.1.0</text>

  <!-- Instruction text -->
  <text x="660" y="700"
        font-family="SF Pro Text, SF Pro Display, -apple-system, Helvetica Neue, sans-serif"
        font-size="14"
        font-weight="400"
        letter-spacing="1"
        text-anchor="middle"
        fill="#5a7a8a"
        fill-opacity="0.45">Drag to Applications to install</text>

  <!-- Corner accent lines (subtle framing) -->
  <g opacity="0.08" stroke="#00d4ff" stroke-width="1">
    <!-- Top-left -->
    <line x1="40" y1="40" x2="100" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="100"/>
    <!-- Top-right -->
    <line x1="1280" y1="40" x2="1220" y2="40"/>
    <line x1="1280" y1="40" x2="1280" y2="100"/>
    <!-- Bottom-left -->
    <line x1="40" y1="760" x2="100" y2="760"/>
    <line x1="40" y1="760" x2="40" y2="700"/>
    <!-- Bottom-right -->
    <line x1="1280" y1="760" x2="1220" y2="760"/>
    <line x1="1280" y1="760" x2="1280" y2="700"/>
  </g>

  <!-- Subtle vignette effect -->
  <rect width="1320" height="800" fill="url(#bgGlow)" opacity="0.15"/>
</svg>