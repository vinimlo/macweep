[package]
name = "macweep"
version = "0.1.1"
edition = "2024"
description = "Native macOS storage cleanup tool — scans and removes regenerable artifacts safely"
authors = ["Vinicius Melo"]
license = "Apache-2.0"
repository = "https://github.com/vinimlo/macweep"

[lib]
name = "macweep_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "macweep"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
