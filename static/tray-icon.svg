<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" role="img" aria-labelledby="title">
  <title id="title">macweep tray icon</title>
  <!-- Simplified sweep mark for macOS menu bar template image -->
  <!-- Black on transparent — macOS handles light/dark adaptation -->
  <path d="
    M 2,13.5
    C 4,12.6 7,10.8 10,9.2
    C 13,7.6 16,6.6 19.5,6.2
    C 16,7.2 13,9 10,11.2
    C 7,13.4 4,14.6 2,15
    Z
  " fill="#000"/>
  <!-- Leading accent line -->
  <path d="
    M 1.5,11
    C 4.5,9.8 8,8 11.5,6.5
    C 15,5 17.5,4.2 20,3.8
  " fill="none" stroke="#000" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
  <!-- Trailing accent line -->
  <path d="
    M 2,16.5
    C 5,15.5 8.5,14 12,12.5
    C 15.5,11 18,10.2 20.5,9.8
  " fill="none" stroke="#000" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
</svg>
