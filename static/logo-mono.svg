<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">macweep</title>

  <defs>
    <clipPath id="c">
      <rect x="20" y="20" width="472" height="472" rx="105"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <rect x="20" y="20" width="472" height="472" rx="105" fill="currentColor" opacity="0.07"/>

  <g clip-path="url(#c)" fill="currentColor">
    <!-- Leading accent line -->
    <path d="M 48,310 C 100,288 175,250 260,218 C 345,186 408,170 452,164"
      fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>

    <!-- Trailing accent line -->
    <path d="M 54,378 C 118,366 194,342 276,318 C 358,294 416,280 458,274"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

    <!-- Main sweep -->
    <path d="M 66,348 C 106,336 170,292 240,250 C 310,208 378,186 448,178 C 378,200 310,252 240,308 C 170,364 106,374 66,362 Z" opacity="0.8"/>

    <!-- Specular highlight -->
    <path d="M 72,348 C 110,336 172,292 242,250 C 312,208 380,186 448,178"
      fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.12"/>

    <!-- Sparkle dots -->
    <circle cx="440" cy="172" r="8" opacity="0.4"/>
    <circle cx="416" cy="190" r="5" opacity="0.25"/>
    <circle cx="454" cy="160" r="4" opacity="0.2"/>
  </g>

  <rect x="20" y="20" width="472" height="472" rx="105" fill="none" stroke="currentColor" stroke-opacity="0.1" stroke-width="1.5"/>
</svg>
